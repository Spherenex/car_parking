<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Car Parking | Drive Console</title>
<style>
:root{color-scheme:dark;--bg:#09121c;--panel:#101e2c;--line:#2a4053;--ink:#f0f7ff;--muted:#aabfd0;--mint:#67e4bc;--red:#ff9b9b;font-family:system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 15% 0%,#143849,transparent 48%),var(--bg);min-height:100vh}
main{max-width:1080px;margin:auto;padding:clamp(16px,4vw,44px)}header,.bar,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:clamp(2rem,6vw,3.75rem);letter-spacing:-.06em;margin:0}h2{margin:0;font-size:1.15rem}p{color:var(--muted);line-height:1.5;margin:.7em 0}
.badge{border:1px solid var(--line);border-radius:30px;padding:8px 13px;color:var(--mint);font-size:.85rem}
.telemetry{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:24px 0 14px}.tile,.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(13px,2.5vw,24px)}
.tile span{display:block;color:var(--muted);font-size:.8rem}.tile strong{display:block;margin-top:4px;font-size:1.2rem}.tile strong.available{color:var(--mint)}.tile strong.engaged{color:var(--red)}
.grid{display:grid;grid-template-columns: minmax(270px, .9fr) minmax(0,1.1fr);gap:14px;align-items:start}.stack{display:grid;gap:14px}.panel[hidden]{display:none}
button,input,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:#152839;padding:9px 11px;min-height:42px}button{cursor:pointer;font-weight:650}button:hover:not(:disabled){border-color:var(--mint)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.primary,[aria-pressed=true],.held{background:var(--mint);color:#06271e;border-color:transparent}.danger{color:var(--red)}.pad .danger{background:#482536;color:#ffe0e0;border-color:#895164}.pad .danger.held{background:#fda5a5;color:#381313}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:22px auto}.pad button{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-height:68px;padding:6px;font-size:.78rem}.pad b{display:block;font-size:1.25rem;pointer-events:none}.f{grid-column:2}.l{grid-column:1;grid-row:2}.s{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}.b{grid-column:2;grid-row:3}
label{display:grid;gap:5px;color:var(--muted);font-size:.85rem;margin:10px 0}input,select{width:100%;min-width:0}.step{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr) auto;gap:5px;align-items:end}.step label{margin:4px 0}.step button{margin-bottom:4px}.route{border-top:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere}.route .actions{justify-content:flex-start}.route p{margin:5px 0 9px}.feedback{min-height:3em}.error{color:var(--red)}details{margin-top:16px}summary{cursor:pointer;color:var(--muted)}.short{justify-content:flex-start}.editor-actions{margin-top:12px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.telemetry{grid-template-columns:repeat(2,1fr)}}@media(max-width:370px){.step{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<header><h1>Car Parking</h1><span id="connection" class="badge">Connecting</span></header>
<section class="telemetry" aria-label="Live telemetry">
<div class="tile"><span>Battery</span><strong id="battery">—</strong></div>
<div class="tile"><span>Voltage</span><strong id="voltage">—</strong></div>
<div class="tile"><span>Obstacle</span><strong id="obstacle">—</strong></div>
<div class="tile"><span>Firebase direction</span><strong id="direction">—</strong></div>
<div class="tile"><span>Parking Slot 1</span><strong id="slot1">—</strong></div>
<div class="tile"><span>Parking Slot 2</span><strong id="slot2">—</strong></div>
</section>
<div class="grid">
<section class="panel">
<div class="bar"><h2>Joystick</h2><div class="actions short"><button id="manual" aria-pressed="true">Manual</button><button id="auto" aria-pressed="false">Auto</button></div></div>
<p id="hint">Click a direction to drive. Click Stop to stop.</p>
<div class="pad" aria-label="Directional controls">
<button class="f" data-dir="F" disabled><b>↑</b>Forward</button>
<button class="l" data-dir="L" disabled><b>←</b>Left</button>
<button class="s danger" data-dir="S" disabled><b>■</b>Stop</button>
<button class="r" data-dir="R" disabled><b>→</b>Right</button>
<button class="b" data-dir="B" disabled><b>↓</b>Backward</button>
</div>
<p id="status" class="feedback" role="status">Connecting to Firebase…</p>
<details><summary>Firebase sign-in</summary>
<form id="authForm"><label>Email<input id="email" type="email" autocomplete="username" required></label>
<label>Password<input id="password" type="password" autocomplete="current-password" required></label>
<div class="actions short"><button>Sign in</button><button id="signOut" type="button" hidden>Sign out</button></div></form>
</details></section>
<div class="stack">
<section class="panel" id="editor" hidden>
<div class="bar"><h2 id="editorTitle">Record route</h2><span id="count" class="badge">0 steps</span></div>
<form id="routeForm">
<label>Route name<input id="routeName" required maxlength="80" placeholder="e.g. Park in Slot 1"></label>
<div id="steps"></div>
<div class="actions short editor-actions"><button id="addStep" type="button">Add step</button><button id="reset" type="button">New route</button><button id="save" class="primary" disabled>Save route</button></div>
</form></section>
<section class="panel"><div class="bar"><h2>Saved routes</h2><span id="routeCount" class="badge">—</span></div><div id="routes"><p>Connecting…</p></div></section>
</div></div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove, push, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyAr4IYnykpwovqOJWzfBd7abVdAma_Ig3Q",
  authDomain: "diet-planner-3bdf3.firebaseapp.com",
  databaseURL: "https://diet-planner-3bdf3-default-rtdb.firebaseio.com",
  projectId: "diet-planner-3bdf3",
  appId: "1:927878354911:web:2e616b171a267b9910566a"
});
const db = getDatabase(app);
const auth = getAuth(app);
const directionRef = ref(db, "Car_Parking/direction");
const routesPath = "Car_Parking/Routes";
const routesRef = ref(db, routesPath);
const labels = {F:"Forward", B:"Backward", L:"Left", R:"Right", S:"Stop"};
const el = id => document.getElementById(id);
const buttons = [...document.querySelectorAll("[data-dir]")];
let online = false, ready = false, revision = 0, auto = false;
let active = null, playback = null, editId = null, saving = false;
let routes = {}, routesLoaded = false, nameIndex = 0;
let unsubscribe = [];

function message(text, error = false) {
  el("status").textContent = text;
  el("status").classList.toggle("error", error);
}

function showSlot(id, slotValue, ultraValue) {
  const output = el(id);
  const values = [slotValue, ultraValue].map(value =>
    value === 1 || value === "1" ? true : value === 0 || value === "0" ? false : null
  );
  const known = values.some(value => value !== null);
  const engaged = values.some(value => value === true);
  output.textContent = known ? (engaged ? "Engaged" : "Available") : "—";
  output.classList.toggle("engaged", known && engaged);
  output.classList.toggle("available", known && !engaged);
}

function controls() {
  for (const button of buttons) {
    button.disabled = !ready || (playback !== null && button.dataset.dir !== "S");
    button.classList.toggle("held", active?.direction === button.dataset.dir);
  }
  el("save").disabled = !online || saving || playback !== null || !el("steps").children.length;
  el("save").textContent = editId ? "Update route" : "Save route";
}

function writeDirection(direction) {
  if (!ready) return Promise.reject(new Error("Firebase control is unavailable."));
  return set(directionRef, direction);
}

function send(direction) {
  writeDirection(direction).catch(error => {
    if (direction !== "S") release(null, false);
    message("Direction write failed. " + error.message, true);
  });
}

function watchConnection() {
  unsubscribe.forEach(stop => stop());
  ready = false;
  if (playback) playback.abort();
  release(null, false);
  const session = ++revision;
  const permission = error => message("Firebase access failed. " + error.message, true);
  unsubscribe = [
    onValue(ref(db, ".info/connected"), async snapshot => {
      if (session !== revision) return;
      online = snapshot.val() === true;
      ready = false;
      if (!online) {
        if (playback) playback.abort();
        release(null, false);
        el("connection").textContent = "Offline";
        message("Firebase connection lost or still connecting.");
        controls();
        return;
      }
      el("connection").textContent = "Online · checking control";
      controls();
      try {
        await onDisconnect(directionRef).set("S");
        if (session !== revision || !online) return;
        ready = true;
        el("connection").textContent = "Controller online";
        message("Ready to drive.");
      } catch (error) {
        if (session !== revision || !online) return;
        el("connection").textContent = "Control unavailable";
        permission(error);
      }
      controls();
      drawRoutes();
    }),
    onValue(ref(db, "Car_Parking"), snapshot => {
      const data = snapshot.val() || {};
      el("battery").textContent = typeof data.Battery === "number" ? data.Battery + "%" : "—";
      el("voltage").textContent = typeof data.Voltage === "number" ? data.Voltage.toFixed(2) + " V" : "—";
      el("obstacle").textContent = data.Obstacle == 1 ? "Detected" : data.Obstacle == 0 ? "Clear" : "—";
      el("direction").textContent = data.direction ?? "—";
      showSlot("slot1", data.Slot1, data.Ultra_Slot1);
      showSlot("slot2", data.Slot2, data.Ultra_Slot2);
    }, permission),
    onValue(routesRef, snapshot => {
      routesLoaded = true;
      routes = snapshot.val() || {};
      drawRoutes();
    }, error => {
      routesLoaded = false;
      routes = {};
      drawRoutes();
      permission(error);
    })
  ];
}

function changeMode(value) {
  if (auto === value) return;
  if (playback) stopPlayback();
  release();
  auto = value;
  el("manual").setAttribute("aria-pressed", String(!auto));
  el("auto").setAttribute("aria-pressed", String(auto));
  el("editor").hidden = !auto;
  el("hint").textContent = auto
    ? "Click a direction to start recording. The next click finishes that step."
    : "Click a direction to drive. Click Stop to stop.";
  drawRoutes();
}
el("manual").onclick = () => changeMode(false);
el("auto").onclick = () => changeMode(true);

function press(direction, key) {
  if (!ready || !Object.hasOwn(labels, direction)) return false;
  if (playback) {
    if (direction === "S") stopPlayback();
    return false;
  }
  if (active) {
    if (active.direction === direction) return false;
    release(null, true, false);
  }
  active = {direction, key, started: performance.now(), record: auto};
  controls();
  send(direction);
  message(auto ? "Recording " + labels[direction] + "… click another direction or Stop to finish the step." : labels[direction] + " active.");
  return true;
}

function release(key = null, record = true, stop = true) {
  if (!active || (key !== null && active.key !== key)) return;
  const held = active;
  active = null;
  if (ready && stop && held.direction !== "S") send("S");
  if (record && held.record) {
    const durationMs = Math.max(1, Math.round(performance.now() - held.started));
    addRow({direction: held.direction, durationMs});
    message("Recorded " + labels[held.direction] + " for " + durationMs + " ms.");
  }
  controls();
}

for (const button of buttons) {
  button.addEventListener("click", () => press(button.dataset.dir, button));
  button.addEventListener("contextmenu", event => event.preventDefault());
}
const keys = {ArrowUp:"F", ArrowDown:"B", ArrowLeft:"L", ArrowRight:"R", Escape:"S"};
window.addEventListener("keydown", event => {
  const direction = keys[event.key];
  if (!direction || (event.key !== "Escape" && event.target.matches("input,select,textarea"))) return;
  event.preventDefault();
  if (!event.repeat) press(direction, event.key);
});
function suspend() {
  if (playback) stopPlayback();
  release();
}
window.addEventListener("blur", suspend);
window.addEventListener("pagehide", suspend);
document.addEventListener("visibilitychange", () => { if (document.hidden) suspend(); });

function addRow(step = {direction:"S", durationMs:1000}) {
  const row = document.createElement("div");
  row.className = "step";
  row.innerHTML = '<label>Step name<input maxlength="80" required></label><label>Direction<select></select></label><label>Time (ms)<input type="number" min="1" max="2147483647" step="1" required></label><button type="button" class="danger" aria-label="Remove step">×</button>';
  const [name, duration] = row.querySelectorAll("input");
  const select = row.querySelector("select");
  for (const [value, label] of Object.entries(labels)) select.add(new Option(label, value));
  ++nameIndex;
  name.value = step.name || "Step " + nameIndex;
  select.value = step.direction;
  duration.value = step.durationMs;
  row.querySelector("button").onclick = () => { row.remove(); refreshEditor(); };
  el("steps").append(row);
  refreshEditor();
}

function refreshEditor() {
  const count = el("steps").children.length;
  el("count").textContent = count + (count === 1 ? " step" : " steps");
  controls();
}

function edit(key = null, route = null) {
  release();
  editId = key;
  nameIndex = 0;
  el("steps").replaceChildren();
  el("routeName").value = route?.name || "";
  el("editorTitle").textContent = key ? "Edit route" : "Record route";
  if (route) for (const step of route.steps) addRow(step);
  refreshEditor();
}
el("addStep").onclick = () => addRow();
el("reset").onclick = () => edit();

el("routeForm").onsubmit = async event => {
  event.preventDefault();
  if (!online || saving || playback) return;
  release();
  const name = el("routeName").value.trim();
  const steps = [...el("steps").children].map(row => {
    const [stepName, duration] = row.querySelectorAll("input");
    return {name:stepName.value.trim(), direction:row.querySelector("select").value, durationMs:Number(duration.value)};
  });
  if (!name || !steps.length || !steps.every(validStep)) {
    message("Enter a route name and complete every step with a positive duration.", true);
    return;
  }
  const originalEdit = editId;
  const target = editId ? ref(db, routesPath + "/" + editId) : push(routesRef);
  saving = true;
  controls();
  try {
    await set(target, {name, steps, updatedAt:serverTimestamp()});
    if (editId === originalEdit && el("routeName").value.trim() === name) {
      editId = target.key;
      el("editorTitle").textContent = "Edit route";
    }
    message("Saved " + name + ".");
  } catch (error) {
    message("Save failed. " + error.message, true);
  } finally {
    saving = false;
    controls();
  }
};

function validStep(step) {
  return step && typeof step.name === "string" && step.name.trim() &&
    Object.hasOwn(labels, step.direction) && Number.isInteger(step.durationMs) &&
    step.durationMs >= 1 && step.durationMs <= 2147483647;
}

function drawRoutes() {
  const container = el("routes");
  container.replaceChildren();
  const entries = Object.entries(routes).filter(([, route]) =>
    route && typeof route.name === "string" && Array.isArray(route.steps) &&
    route.steps.length && Array.from(route.steps).every(validStep));
  entries.sort((a,b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));
  el("routeCount").textContent = routesLoaded ? entries.length : "—";
  if (!entries.length) {
    const detail = document.createElement("p");
    detail.textContent = routesLoaded ? "No routes saved yet." : "Waiting for access to saved routes.";
    container.append(detail);
  }
  for (const [key, route] of entries) {
    const card = document.createElement("article");
    card.className = "route";
    const title = document.createElement("strong");
    title.textContent = route.name;
    const info = document.createElement("p");
    const total = route.steps.reduce((sum, step) => sum + step.durationMs, 0);
    info.textContent = route.steps.length + " steps · " + (total / 1000).toFixed(2) + " s";
    const actions = document.createElement("div");
    actions.className = "actions";
    function action(label, handler, disabled, style = "") {
      const button = document.createElement("button");
      button.textContent = label;
      button.className = style;
      button.disabled = disabled;
      button.onclick = handler;
      actions.append(button);
    }
    action("Run", () => runRoute(route), !ready || !auto || Boolean(playback), "primary");
    action("Edit", () => { changeMode(true); edit(key, route); el("routeName").focus(); }, saving || Boolean(playback));
    action("Delete", async () => {
      if (!confirm("Delete route “" + route.name + "”?")) return;
      try {
        await remove(ref(db, routesPath + "/" + key));
        if (editId === key) edit();
        message("Deleted " + route.name + ".");
      } catch (error) { message("Delete failed. " + error.message, true); }
    }, !online || Boolean(playback), "danger");
    card.append(title, info, actions);
    container.append(card);
  }
}

function waitForStep(ms, signal) {
  if (signal.aborted) return Promise.resolve();
  return new Promise(resolve => {
    const finish = () => {
      clearTimeout(timer);
      signal.removeEventListener("abort", finish);
      resolve();
    };
    const timer = setTimeout(finish, ms);
    signal.addEventListener("abort", finish, {once:true});
  });
}

function stopPlayback() {
  playback?.abort();
  if (ready) send("S");
}

async function runRoute(route) {
  if (!ready || !auto || playback || active) return;
  const run = new AbortController();
  playback = run;
  controls();
  drawRoutes();
  let failure = null;
  try {
    for (const step of route.steps) {
      if (run.signal.aborted) break;
      message(route.name + " · " + step.name + " · " + labels[step.direction]);
      await writeDirection(step.direction);
      await waitForStep(step.durationMs, run.signal);
    }
  } catch (error) {
    failure = error;
  } finally {
    if (ready) {
      try { await writeDirection("S"); }
      catch (error) { failure ??= error; }
    }
    playback = null;
    controls();
    drawRoutes();
    if (failure) message("Playback failed. " + failure.message, true);
    else if (run.signal.aborted) message(ready ? "Playback stopped." : "Playback interrupted. Firebase control is unavailable.", !ready);
    else message("Completed " + route.name + ".");
  }
}

el("authForm").onsubmit = async event => {
  event.preventDefault();
  try {
    await signInWithEmailAndPassword(auth, el("email").value.trim(), el("password").value);
    el("password").value = "";
  } catch (error) { message("Sign-in failed. " + error.message, true); }
};
el("signOut").onclick = async () => {
  suspend();
  try { await signOut(auth); }
  catch (error) { message("Sign-out failed. " + error.message, true); }
};
onAuthStateChanged(auth, user => {
  el("signOut").hidden = !user;
  watchConnection();
});
</script>
</body>
</html>
